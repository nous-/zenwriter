<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- Primary Meta Tags -->
		<title>ZenWriter — Free, Private Distraction-Free Writing</title>
		<link rel="canonical" href="https://zenwriter.live/" />
		<link rel="icon" href="/zenwriter-garden-mark.png" type="image/png" />
		<meta name="description" content="ZenWriter is free and private. Your writing is saved only in your browser and never sent to a server. No account needed—just you and your thoughts." />
		<meta name="author" content="ZenWriter" />
		<meta name="theme-color" content="#000000" />
		<meta name="color-scheme" content="dark light" />

		<!-- Open Graph / Facebook -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="ZenWriter" />
		<meta property="og:url" content="https://zenwriter.live/" />
		<meta property="og:title" content="ZenWriter — Free, Private Distraction-Free Writing" />
		<meta property="og:description" content="ZenWriter is free and private. Your writing is saved only in your browser and never sent to a server. No account needed—just you and your thoughts." />
		<meta property="og:image" content="https://zenwriter.live/og.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="ZenWriter — free, private, distraction-free writing" />
		<meta property="og:locale" content="en_US" />

		<!-- Twitter -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="ZenWriter — Free, Private Distraction-Free Writing" />
		<meta name="twitter:description" content="ZenWriter is free and private. Your writing is saved only in your browser and never sent to a server. No account needed—just you and your thoughts." />
		<meta name="twitter:image" content="https://zenwriter.live/og.png" />
		<meta name="twitter:image:alt" content="ZenWriter — free, private, distraction-free writing" />

		<!-- Fonts -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,300;0,7..72,400;0,7..72,500;1,7..72,300;1,7..72,400;1,7..72,500&display=swap" rel="stylesheet" />

		<!-- Structured Data -->
		<script type="application/ld+json">
		{
			"@context": "https://schema.org",
			"@type": "WebApplication",
			"name": "ZenWriter",
			"url": "https://zenwriter.live/",
			"image": "https://zenwriter.live/og.png",
			"description": "ZenWriter is free and private. Your writing is saved only in your browser and never sent to a server. No account needed—just you and your thoughts.",
			"applicationCategory": "ProductivityApplication",
			"operatingSystem": "Any",
			"browserRequirements": "Requires a modern web browser",
			"isAccessibleForFree": true,
			"sameAs": "https://github.com/nous-/zenwriter",
			"offers": {
				"@type": "Offer",
				"price": "0",
				"priceCurrency": "USD"
			}
		}
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
